services:
  database:
    image: postgres:16-alpine
    container_name: survey_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - survey_network
  cache:
    image: redis:7.2-alpine
    container_name: survey_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - survey_network

networks:
  survey_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
